<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú lateral del panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
<style>
/* == Pase de diseño (criterios emil-design-eng) == */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1)}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
a,button,input,select,textarea,label,[role=button]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{transition:transform 160ms var(--ease-out),background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease}
button:not(:disabled):active,a.btn:active,.heme-btn:active{transform:scale(.97)}
h1,h2{letter-spacing:-.02em;text-wrap:balance}
p{text-wrap:pretty}
.tn,time{font-variant-numeric:tabular-nums}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
@media (hover:none){[class]:hover:not(:active),[class]:hover:not(:active) img{transform:none!important}}

body{margin:0}
.sbl{transition:background-color .15s ease,color .15s ease}.sbl:hover{background:#F2F4F5}
</style>
</helmet>
<nav aria-label="Menú del panel" style="width:100%;height:100%;min-height:1000px;box-sizing:border-box;background:#FFFFFF;color:#1C1E21;box-shadow:inset -1px 0 0 #E1E3E6;padding:22px 14px;display:flex;flex-direction:column;gap:2px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
  <a href="Admin.dc.html" style="display:flex;align-items:center;gap:10px;padding:0 10px 18px;text-decoration:none"><img src="/_blob/1b16c658d676a48f9564e3144cfa63aa" alt="JIUMP" style="height:48px;width:auto"><span style="font-family:'Segoe UI','Open Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;color:#0073B1">ADMIN</span></a>
  <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="5">
    <span style="padding:14px 12px 6px;font-family:'Segoe UI','Open Sans',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5F5A60">{{ g.titulo }}</span>
    <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
      <a class="sbl" href="{{ it.href }}" style="{{ it.estilo }}"><span aria-hidden="true" style="width:18px;text-align:center;opacity:.85">{{ it.icono }}</span>{{ it.nombre }}</a>
    </sc-for>
  </sc-for>
  <div style="margin-top:auto;padding:14px 12px 0;border-top:1px solid #E1E3E6;display:flex;flex-direction:column;gap:4px;font-size:13px">
    <strong style="font-size:14px">[Nombre del usuario]</strong>
    <span style="color:#5F5A60">Rol: {{ rolNombre }}</span>
    <a href="#" style="color:#0073B1;font-weight:600;margin-top:4px">Cerrar sesión</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activo":{"editor":"enum","options":["escritorio","articulos","categorias","eventos","inicio","institucional","menu","medios","galerias","podcast","recursos","usuarios","actividad","configuracion"],"default":"escritorio"},"rol":{"editor":"enum","options":["super","editor","eventos","multimedia"],"default":"super"},"$preview":{"width":260,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const activo = this.props.activo ?? 'escritorio';
    const rol = this.props.rol ?? 'super';
    const S = 'super', E = 'editor', V = 'eventos', M = 'multimedia';
    const def = [
      { titulo: 'General', items: [
        { k: 'escritorio', nombre: 'Escritorio', icono: '◧', href: 'Admin.dc.html', roles: [S, E, V, M] } ] },
      { titulo: 'Contenido', items: [
        { k: 'articulos', nombre: 'Artículos', icono: '✎', href: 'AdminArticulos.dc.html', roles: [S, E] },
        { k: 'categorias', nombre: 'Series y categorías', icono: '#', href: 'AdminArticulos.dc.html', roles: [S, E] },
        { k: 'eventos', nombre: 'Eventos y actividades', icono: '◷', href: 'AdminActividades.dc.html', roles: [S, V] } ] },
      { titulo: 'Sitio web', items: [
        { k: 'inicio', nombre: 'Administrar página web', icono: '▤', href: 'AdminWeb.dc.html', roles: [S] },
        { k: 'institucional', nombre: 'Información institucional', icono: 'ℹ', href: 'AdminSitio.dc.html', roles: [S] },
        { k: 'menu', nombre: 'Menú, enlaces y pie', icono: '☰', href: 'AdminSitio.dc.html', roles: [S] } ] },
      { titulo: 'Multimedia', items: [
        { k: 'medios', nombre: 'Biblioteca de fotos', icono: '▣', href: 'AdminMedios.dc.html', roles: [S, M, E, V] },
        { k: 'galerias', nombre: 'Galerías y álbumes', icono: '❐', href: 'AdminMedios.dc.html', roles: [S, M] },
        { k: 'podcast', nombre: 'Videos', icono: '▶', href: 'AdminVideos.dc.html', roles: [S, M] } ] },
      { titulo: 'Administración', items: [
        { k: 'usuarios', nombre: 'Usuarios y roles', icono: '⚿', href: 'AdminUsuarios.dc.html', roles: [S] },
        { k: 'actividad', nombre: 'Registro de actividad', icono: '≡', href: 'AdminUsuarios.dc.html', roles: [S] },
        { k: 'configuracion', nombre: 'Configuración', icono: '⚙', href: '#', roles: [S] } ] }
    ];
    const base = 'display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:12px;font-size:14.5px;text-decoration:none;';
    const grupos = def.map(function (g) {
      return { titulo: g.titulo, items: g.items.filter(function (it) { return it.roles.indexOf(rol) >= 0; }).map(function (it) {
        const on = it.k === activo;
        return { nombre: it.nombre, icono: it.icono, href: it.href, estilo: base + (on ? 'background:#E3F0F8;color:#005A8C;font-weight:600;box-shadow:inset 3px 0 0 #00AB9F' : 'color:#1C1E21') };
      }) };
    }).filter(function (g) { return g.items.length > 0; });
    const nombres = { super: 'Superadministrador', editor: 'Editor', eventos: 'Eventos', multimedia: 'Multimedia' };
    return { grupos: grupos, rolNombre: nombres[rol] };
  }
}
</script>
</body>
</html>
