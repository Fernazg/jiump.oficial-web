# Pruebas automáticas: levanta Supabase LOCAL dentro del runner (Docker) y
# corre las pruebas del backend (pgTAP + HTTP) y del sitio (compilación +
# Playwright).
# No usa ningún proyecto de Supabase en la nube ni secretos del repositorio:
# las claves salen de `supabase status` y solo existen durante la ejecución.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI: supabase@3.1.0

jobs:
  backend:
    name: Backend y sitio (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Levantar Supabase local
        run: >
          npx --yes ${{ env.SUPABASE_CLI }} start
          -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Base limpia (migraciones + seed)
        run: npx --yes ${{ env.SUPABASE_CLI }} db reset

      - name: Lint del esquema
        run: npx --yes ${{ env.SUPABASE_CLI }} db lint --fail-on error

      - name: Pruebas pgTAP
        run: npx --yes ${{ env.SUPABASE_CLI }} test db

      - name: Subir fotos del diseño al Storage local
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" supabase/scripts/subir-fotos-diseno.sh

      - name: Prueba de integración HTTP
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          API_URL="$API_URL" ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node --test supabase/tests/api/permisos-api.test.mjs

      # ---- Sitio público (app/) ------------------------------------------
      - name: Instalar dependencias del sitio
        working-directory: app
        run: npm ci

      - name: Revisar tipos
        working-directory: app
        run: npm run typecheck

      - name: Configurar el sitio con la clave anónima local
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > app/.env.local

      - name: Compilar el sitio
        working-directory: app
        run: npm run build

      - name: Instalar Chromium para Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Pruebas del sitio (Playwright)
        working-directory: app
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npx playwright test

      - name: Guardar el informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: app/playwright-report
          retention-days: 7

      - name: Detener Supabase
        if: always()
        run: npx --yes ${{ env.SUPABASE_CLI }} stop --no-backup
