# Pruebas automáticas: levanta Supabase LOCAL dentro del runner (Docker) y
# corre las pruebas del backend (pgTAP + HTTP), del sitio y del panel /admin (compilación +
# Playwright).
# No usa ningún proyecto de Supabase en la nube ni secretos del repositorio:
# las claves salen de `supabase status` y solo existen durante la ejecución.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI: supabase@3.1.0

jobs:
  backend:
    name: Backend y sitio (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # mailpit queda encendido: recibe los correos de «Recuperar contraseña» e invitaciones del panel.
      # Si el runner tiene un puerto ocupado, el script limpia y reintenta una vez (ver el script).
      - name: Levantar Supabase local
        run: >
          .github/scripts/levantar-supabase.sh
          studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Base limpia (migraciones + seed)
        run: npx --yes ${{ env.SUPABASE_CLI }} db reset

      # La base parte sin permisos por defecto, como producción (supabase/roles.sql).
      - name: Permisos de la API iguales a los esperados
        run: supabase/tests/permisos/probar-permisos.sh

      - name: Lint del esquema
        run: npx --yes ${{ env.SUPABASE_CLI }} db lint --fail-on error

      - name: Pruebas pgTAP
        run: npx --yes ${{ env.SUPABASE_CLI }} test db

      - name: Subir fotos del diseño al Storage local
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" supabase/scripts/subir-fotos-diseno.sh

      - name: Prueba de integración HTTP
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          API_URL="$API_URL" ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node --test supabase/tests/api/permisos-api.test.mjs

      # ---- Sitio público (app/) ------------------------------------------
      - name: Instalar dependencias del sitio
        working-directory: app
        run: npm ci

      - name: Revisar tipos
        working-directory: app
        run: npm run typecheck

      - name: Configurar el sitio con la clave anónima local
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > app/.env.local

      - name: Compilar el sitio
        working-directory: app
        run: npm run build

      - name: Instalar Chromium para Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Pruebas del sitio y del panel /admin (Playwright)
        working-directory: app
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npx playwright test

      # ---- Worker de Cloudflare (plan gratuito: 10 ms de procesador) ------
      # Va después de Playwright: `cf:build` vuelve a compilar el sitio.
      - name: Compilar el Worker de Cloudflare
        working-directory: app
        run: npm run cf:build

      - name: Pruebas del Worker y procesador por página (menos de 10 ms)
        working-directory: app
        run: |
          eval "$(npx --yes ${{ env.SUPABASE_CLI }} status -o env)"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .dev.vars
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/robots.txt && break; sleep 2; done
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/probar-worker.mjs http://127.0.0.1:8787
          grande=$(cd .open-next/assets && find _next/static -name '*.js' -size +100k | head -1)
          MEDIR_N=60 MEDIR_LIMITE=10 MEDIR_PISO="/marca/logo-jiump.png,/$grande" node scripts/medir-procesador.mjs http://127.0.0.1:8787 \
            / /nosotros /eventos /eventos/convencion-nacional-2026 /articulos /articulos/como-comenzo-la-biblia \
            "/articulos?serie=mes-de-la-biblia" /galeria "/galeria?filtro=2026" /galeria/convencion-nacional-2026 \
            /sitemap.xml /robots.txt /mantenimiento | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Registro del Worker si falla
        if: failure()
        working-directory: app
        run: tail -100 wrangler.log || true

      - name: Guardar el informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: app/playwright-report
          retention-days: 7

      - name: Detener Supabase
        if: always()
        run: npx --yes ${{ env.SUPABASE_CLI }} stop --no-backup
